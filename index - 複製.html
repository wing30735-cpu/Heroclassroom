<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Classroom 英雄教室</title>
    
    <!-- 1. 引入 React 和 ReactDOM (UMD Global) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- 2. 引入 Babel 解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 3. 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 4. 設定 Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'fadeIn': 'fadeIn 0.3s ease-out forwards',
                        'bounce-slow': 'bounce 2s infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'scale(0.95)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- 5. Import Map: 解決 Failed to resolve module specifier 'react' 錯誤 -->
    <script type="importmap">
        {
            "imports": {
                "react": "data:text/javascript;charset=utf-8,export const {useState,useEffect,useRef,createElement,forwardRef} = window.React; export default window.React;",
                "react-dom": "data:text/javascript;charset=utf-8,export default window.ReactDOM;"
            }
        }
    </script>

    <!-- 6. 載入 Lucide React 圖示庫 -->
    <script type="module">
        import * as Lucide from "https://esm.sh/lucide-react@0.469.0?external=react";
        window.LucideIcons = Lucide;
        window.dispatchEvent(new Event('lucide-loaded'));
    </script>

    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: #1e293b; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        .preserve-3d { transform-style: preserve-3d; }
        .translate-z-10 { transform: translateZ(10px); }
        .translate-z-20 { transform: translateZ(20px); }
        .perspective-1000 { perspective: 1000px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function AppContainer() {
            const [iconsLoaded, setIconsLoaded] = useState(false);

            useEffect(() => {
                if (window.LucideIcons) {
                    setIconsLoaded(true);
                } else {
                    const handler = () => setIconsLoaded(true);
                    window.addEventListener('lucide-loaded', handler);
                    return () => window.removeEventListener('lucide-loaded', handler);
                }
            }, []);

            if (!iconsLoaded) {
                return (
                    <div className="flex h-screen items-center justify-center bg-slate-900 text-indigo-400">
                        <div className="text-center">
                            <div className="text-4xl animate-spin mb-4">⚔️</div>
                            <div className="font-bold">正在召喚英雄...</div>
                        </div>
                    </div>
                );
            }

            return <App />;
        }

            const totalCP = activeCourse?.students.reduce((acc, curr) => acc + curr.cp, 0) || 0;
            const damagePercent = activeBoss ? Math.min((totalCP / activeBoss.hp) * 100, 100) : 0;
            const isDefeated = damagePercent >= 100;

            const getJobInfo = (jobId) => JOB_DEFINITIONS.find(j => j.id === jobId) || JOB_DEFINITIONS[0];
            const getBuffInfo = (buffId) => BUFF_DEFINITIONS.find(b => b.id === buffId) || BUFF_DEFINITIONS[0];
            const getHighestRarity = (inventory) => {
                if (!inventory || inventory.length === 0) return 'COMMON';
                if (inventory.some(i => i.rarity === 'LEGENDARY')) return 'LEGENDARY';
                if (inventory.some(i => i.rarity === 'EPIC')) return 'EPIC';
                if (inventory.some(i => i.rarity === 'RARE')) return 'RARE';
                return 'COMMON';
            };
            const getEquippedItem = (inventory, slotType) => {
                if (!inventory) return null;
                const items = inventory.filter(i => {
                    if (i.slot === slotType) return true;
                    if (!i.slot) {
                        if (slotType === 'head' && i.id.includes('crown')) return true;
                        if (slotType === 'weapon' && (i.id.includes('sword') || i.id.includes('wand'))) return true;
                        if (slotType === 'offhand' && (i.id.includes('book') || i.id.includes('shield'))) return true;
                        if (slotType === 'feet' && i.id.includes('boots')) return true;
                        if (slotType === 'accessory' && i.id.includes('ring')) return true;
                    }
                    return false;
                });
                if (items.length === 0) return null;
                return items[items.length - 1];
            };

            const calculateRewards = (student, quest) => {
                const job = getJobInfo(student.job);
                const isBonus = job.bonus === quest.type;
                const jobMultiplier = isBonus ? 1.5 : 1;
                const levelScale = 1 + (student.lv - 1) * 0.1;
                let xpMultiplier = 1;
                let cpMultiplier = 1;
                let gpMultiplier = 1;
                let equipXpBonus = 0;
                let equipCpBonus = 0;
                let equipGpBonus = 0;

                if (student.buffs && student.buffs.length > 0) {
                    student.buffs.forEach(buff => {
                        const def = getBuffInfo(buff.id);
                        if (def.type === 'xp' || def.type === 'all') xpMultiplier *= def.value;
                        if (def.type === 'cp' || def.type === 'all') cpMultiplier *= def.value;
                    });
                }
                if (student.inventory) {
                    student.inventory.forEach(item => {
                        if (item.type === 'buff') {
                            if (item.buffType === 'xp') equipXpBonus += item.value;
                            if (item.buffType === 'cp') equipCpBonus += item.value;
                            if (item.buffType === 'gp') equipGpBonus += item.value;
                        }
                    });
                }
                const totalXPMultiplier = jobMultiplier * levelScale * (1 + equipXpBonus) * xpMultiplier;
                const totalCPMultiplier = jobMultiplier * levelScale * (1 + equipCpBonus) * cpMultiplier;
                const totalGPMultiplier = (1 + equipGpBonus) * 1;

                return {
                    finalXP: Math.floor(quest.xp * totalXPMultiplier),
                    finalCP: Math.floor(quest.cp * totalCPMultiplier),
                    finalGP: Math.floor(quest.gp * totalGPMultiplier),
                    isBonus,
                    levelScale,
                    equipmentBonus: []
                };
            };

            const handleCompleteQuest = (studentId, quest) => {
                // 0. Prevent double trigger if modal is already open
                if (isChallengeModalOpen) return;

                // 1. Find current data synchronously
                const currentCourse = courses.find(c => c.id === activeCourseId);
                if (!currentCourse) return;
                
                const student = currentCourse.students.find(s => s.id === studentId);
                if (!student || student.hp <= 0) {
                    if (student) showAlert(`${student.name} 力竭中！`);
                    return;

                // 2. Determine random challenge synchronously
                // Trigger only if boss is alive and random chance met (40% chance)
                // Also added check to ensure we don't trigger if already active
                const triggerChallenge = !currentCourse.isBossDefeated && Math.random() < 0.4 && !activeChallenge;

                // 3. Update State for Quest Completion (Standard Rewards)
                setCourses(prev => prev.map(course => {
                    if (course.id !== activeCourseId) return course;
                    
                    let levelUpInfo = null;
                    let dropsInfo = [];

                    const updatedStudents = course.students.map(s => {
                        if (s.id !== studentId) return s;
                        
                        const rewards = calculateRewards(s, quest);
                        let dropGP = 0;
                        let dropBuffs = [];
                        if (Math.random() < 0.3) {
                            const roll = Math.random();
                            if (roll < 0.4) { dropBuffs.push({ id: 'xp_scroll', charges: 3 }); dropsInfo.push('📜 專注卷軸'); }
                            else if (roll < 0.7) { dropBuffs.push({ id: 'cp_potion', charges: 3 }); dropsInfo.push('⚗️ 勇氣藥水'); }
                            else if (roll < 0.9) { dropGP = 50; dropsInfo.push('💰 小錢袋(+50G)'); }
                            else { dropBuffs.push({ id: 'golden_egg', charges: 1 }); dropsInfo.push('🥚 幸運金蛋'); }
                        }
                        let newXp = s.xp + rewards.finalXP;
                        let newLv = s.lv;
                        let newMaxXp = s.maxXp;
                        if (newXp >= s.maxXp) { newXp -= s.maxXp; newLv += 1; newMaxXp = Math.floor(s.maxXp * 1.2); levelUpInfo = s.name; }
                        let finalBuffs = [];
                        if (s.buffs) {
                            s.buffs.forEach(b => { if (b.charges > 1) finalBuffs.push({ ...b, charges: b.charges - 1 }); });
                        }
                        finalBuffs = [...finalBuffs, ...dropBuffs];
                        return { ...s, lv: newLv, xp: newXp, maxXp: newMaxXp, cp: s.cp + rewards.finalCP, gp: s.gp + rewards.finalGP + dropGP, buffs: finalBuffs };
                    });

                    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const r = calculateRewards(student, quest);
                    let log = `[${time}] ⚔️ ${student.name} 完成任務`;
                    const tags = [`+${r.finalCP}CP`, `+${r.finalGP}GP`];
                    if (r.isBonus) tags.push('🔥職業加成');
                    if (dropsInfo.length > 0) tags.push(`🎲掉落: ${dropsInfo.join(' ')}`);
                    log += ` [${tags.join(', ')}]`;
                    
                    let newLogs = [log, ...course.logs].slice(0, 20);
                    if (levelUpInfo) newLogs = [`[${time}] 🎉 ${levelUpInfo} 升級了！`, ...newLogs];
                    
                    const newTotalCP = updatedStudents.reduce((acc, curr) => acc + curr.cp, 0);
                    const currentBoss = BOSS_DEFINITIONS.find(b => b.id === course.bossId);
                    let bossDefeatedNow = false;
                    
                    if (!course.isBossDefeated && newTotalCP >= currentBoss.hp) {
                        bossDefeatedNow = true;
                        newLogs = [`[${time}] 🏆 ${currentBoss.name} 被擊敗了！`, ...newLogs];
                    }

                    return { ...course, students: updatedStudents, logs: newLogs, isBossDefeated: course.isBossDefeated || bossDefeatedNow };
                }));

                // 4. Open Challenge Modal if triggered
                if (triggerChallenge) {
                     const monster = CHALLENGE_MONSTERS[Math.floor(Math.random() * CHALLENGE_MONSTERS.length)];

            const handleChallengeResolve = (success) => {

                    if (c.id !== activeCourseId) return c;
                    
                    const logMsg = success 
                        ? `[挑戰] ${activeChallenge.studentName} 成功回答了 ${activeChallenge.monster.name} 的問題！(大獎勵)`
                        : `[挑戰] ${activeChallenge.studentName} 被 ${activeChallenge.monster.name} 攻擊了！(-3 HP)`;

                    const updatedStudents = c.students.map(s => {
                        if (s.id !== activeChallenge.studentId) return s;
                        if (success) {
                             // High Score Reward
                             return { ...s, cp: s.cp + 50, gp: s.gp + 100, xp: s.xp + 30 };
                        } else {
                             // Penalty
                             return { ...s, hp: Math.max(0, s.hp - 3) };
                        }
                    });
                     return { ...c, students: updatedStudents, logs: [logMsg, ...c.logs] };
                }));

                // Reset challenge state explicitly to allow re-triggering
                setIsChallengeModalOpen(false);
                setTimeout(() => setActiveChallenge(null), 300); // Wait for modal animation to finish
            };

            const handleBuyItem = (item) => {
                if (!targetStudent) return;
                setCourses(prev => prev.map(c => {
                    if (c.id !== activeCourseId) return c;
                    const s = c.students.find(st => st.id === targetStudent.id);
                    if (s.gp < item.cost) { showAlert('金幣不足！'); return c; }
                    if (item.ownerId) { showAlert('該物品已被買走！'); return c; }
                    if (s.inventory.length >= 5) { showAlert('背包已滿！請先捨棄舊道具。'); return c; }
                    const updatedStudents = c.students.map(st => st.id !== targetStudent.id ? st : { ...st, gp: st.gp - item.cost, inventory: [...st.inventory, { ...item, ownerId: st.id }] });
                    const updatedShop = c.shopItems.map(i => i.id === item.id ? { ...i, ownerId: s.id } : i);
                    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    return { ...c, students: updatedStudents, shopItems: updatedShop, logs: [`[${time}] 🛍️ ${s.name} 購買了【${item.name}】！`, ...c.logs] };
                }));
                setIsShopModalOpen(false); setTargetStudent(null);
            };

            const handleDiscardItem = (student, itemIndex) => {
                setDiscardTarget({ studentId: student.id, itemIndex: itemIndex, itemName: student.inventory[itemIndex].name, itemIcon: student.inventory[itemIndex].iconType });
            };
            const confirmDiscard = () => {
                if (discardTarget) {
                    setCourses(prev => prev.map(c => {
                        if (c.id !== activeCourseId) return c;
                        return { ...c, students: c.students.map(s => { if (s.id !== discardTarget.studentId) return s; const newInventory = [...s.inventory]; newInventory.splice(discardTarget.itemIndex, 1); return { ...s, inventory: newInventory }; }), logs: [`[系統] ${courses.find(co => co.id === activeCourseId).students.find(st => st.id === discardTarget.studentId).name} 丟棄了 ${discardTarget.itemName}`, ...c.logs] };
                    }));
                    setDiscardTarget(null);
                }
            };

            const handleAddCourse = () => {
                handleAdminCheck(() => {
                    if (!newCourseName.trim()) return;
                    setCourses([...courses, { id: `course-${Date.now()}`, name: newCourseName, icon: 'Map', students: [], logs: [`[系統] 副本建立`], bossId: 'slime', bossReward: '神秘獎勵', isBossDefeated: false, shopItems: JSON.parse(JSON.stringify(INITIAL_SHOP_ITEMS)) }]);
                    setActiveCourseId(`course-${Date.now()}`);
                    setNewCourseName('');
                });
            };

            // NEW: Handle Delete Course
            const handleDeleteCourse = (courseId, e) => {
                e.stopPropagation();
                handleAdminCheck(() => {
                    showConfirm("確定要刪除此副本嗎？此操作無法復原！", () => {
                        setCourses(prevCourses => {
                            const newCourses = prevCourses.filter(c => c.id !== courseId);
                            // If we deleted the active course, switch to another one or clear it
                            if (activeCourseId === courseId) {
                                setActiveCourseId(newCourses.length > 0 ? newCourses[0].id : null);
                            }
                            return newCourses;
                        });
                        showAlert("副本已刪除");
                    });
                });
            };

            const openShop = (student, e) => { e.stopPropagation(); setTargetStudent(student); setIsShopModalOpen(true); };
            const openBuffModal = (student) => { setTargetStudent(student); setIsBuffModalOpen(true); };
            const openInventoryViewer = (student) => { setTargetStudent(student); setIsInventoryViewerOpen(true); };
            const handleGrantBuff = () => { if (!targetStudent) return; const buffDef = getBuffInfo(selectedBuffId); setCourses(prev => prev.map(c => c.id === activeCourseId ? { ...c, students: c.students.map(s => s.id === targetStudent.id ? { ...s, buffs: [...(s.buffs || []), { id: selectedBuffId, charges: buffDef.charges }] } : s), logs: [`🎁 老師賜予 ${targetStudent.name} ${buffDef.name}`, ...c.logs] } : c)); setIsBuffModalOpen(false); setTargetStudent(null); };

            const openBossModal = () => {
                handleAdminCheck(() => {
                    setSelectedBossId(activeCourse.bossId);
                    setCustomReward(activeCourse.bossReward);
                    setIsBossModalOpen(true);
                });
            };

            const handleSaveBoss = () => {
                if (!customReward.trim()) return showAlert('請輸入獎勵！');
                setCourses(prev => prev.map(c => {
                    if (c.id !== activeCourseId) return c;
                    const resetStudents = c.students.map(student => ({ ...student, cp: 0 }));
                    return { ...c, bossId: selectedBossId, bossReward: customReward, isBossDefeated: false, students: resetStudents, logs: [`[系統] 新魔王出現！所有英雄 CP 已歸零。`, ...c.logs] };
                }));
                setIsBossModalOpen(false); setIsChestOpen(false); setShowRewardModal(false);
            };

            const handleOpenChest = () => { setIsChestOpen(true); setTimeout(() => setShowRewardModal(true), 1000); };
            const handleDamage = (studentId, e) => { e.stopPropagation(); setCourses(prev => prev.map(c => c.id === activeCourseId ? { ...c, students: c.students.map(s => s.id === studentId ? { ...s, hp: Math.max(0, s.hp - 2) } : s), logs: [`⚠️ ${c.students.find(s => s.id === studentId).name} 受傷 (-2 HP)`, ...c.logs] } : c)); };
            const handleRemedy = (studentId) => { setCourses(prev => prev.map(c => c.id === activeCourseId ? { ...c, students: c.students.map(s => s.id === studentId ? { ...s, hp: MAX_HP } : s), logs: [`❤️‍🩹 ${c.students.find(s => s.id === studentId).name} 復活`, ...c.logs] } : c)); };

            const submitNewStudent = () => {
                handleAdminCheck(() => {
                    if (!recruitName.trim()) return;
                    setCourses(prev => prev.map(c => c.id === activeCourseId ? { ...c, students: [...c.students, { id: Math.max(0, ...c.students.map(s => s.id)) + 1, name: recruitName, job: recruitJobId, lv: 1, xp: 0, maxXp: 100, cp: 0, gp: 0, hp: MAX_HP, maxHp: MAX_HP, buffs: [], inventory: [], jobChangeCount: 0 }] } : c));
                    setRecruitName('');
                    setIsStudentModalOpen(false);
                });
            };

            const promptDeleteStudent = (id, e) => {
                e.stopPropagation();
                handleAdminCheck(() => {
                    setDeleteTargetId(id);
                });
            };

            const confirmDelete = () => {
                if (deleteTargetId !== null) {
                    setCourses(prev => prev.map(c => c.id === activeCourseId ? { ...c, students: c.students.filter(s => s.id !== deleteTargetId) } : c));
                    setDeleteTargetId(null);
                }
            };

            const handleJobChange = () => { 
                if (!targetStudent) return; 
                const currentCount = targetStudent.jobChangeCount || 0;
                
                if (currentCount >= 2) {
                    showAlert("這位英雄已經轉職兩次，無法再變更職業了！");
                    setIsJobChangeModalOpen(false);
                    return;
                }

                setCourses(prev => prev.map(c => c.id === activeCourseId ? { 
                    ...c, 
                    students: c.students.map(s => s.id === targetStudent.id ? { ...s, job: newJobId, jobChangeCount: (s.jobChangeCount || 0) + 1 } : s), 
                    logs: [`🔄 ${targetStudent.name} 轉職 (第 ${currentCount + 1}/2 次)`, ...c.logs] 
                } : c)); 
                setIsJobChangeModalOpen(false); 
            };

            // NEW: Handle Edit Student
            const openEditStudentModal = (student, e) => {
                e.stopPropagation();
                handleAdminCheck(() => {
                    setEditingStudent({ ...student });
                    setIsEditStudentModalOpen(true);
                });
            };

            const handleSaveStudentEdit = () => {
                if (!editingStudent) return;
                setCourses(prev => prev.map(c => {
                    if (c.id !== activeCourseId) return c;
                    const updatedStudents = c.students.map(s => s.id === editingStudent.id ? editingStudent : s);
                    return { ...c, students: updatedStudents, logs: [`[系統] ${editingStudent.name} 資料已修正`, ...c.logs] };
                }));
                setIsEditStudentModalOpen(false);
                setEditingStudent(null);
            };

            if (!activeCourse) return <div className="p-10 text-white">載入中...</div>;

            return (
                <div className="flex h-screen bg-slate-900 text-slate-100 font-sans overflow-hidden">
                    {/* Sidebar */}
                    <aside className={`${isSidebarOpen ? 'w-64' : 'w-16'} bg-slate-800 border-r border-slate-700 flex flex-col transition-all duration-300 relative z-20`}>
                        <div className="p-4 border-b border-slate-700 flex items-center justify-between">
                            {isSidebarOpen && <h2 className="font-bold text-lg text-white flex items-center gap-2"><Map className="text-yellow-500" /> 副本列表</h2>}
                            <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-1 hover:bg-slate-700 rounded text-slate-400"><Layout size={20} /></button>
                        </div>

                        {/* Admin Toggle & Backup Controls */}
                        <div className="p-2 border-b border-slate-700 space-y-2">
                            <button
                                onClick={toggleAdminLock}
                                className={`w-full py-2 rounded flex items-center justify-center gap-2 font-bold transition-all ${isAdminMode ? 'bg-red-900/30 text-red-400 border border-red-900/50' : 'bg-slate-700/30 text-slate-500 border border-transparent hover:bg-slate-700'}`}
                                title={isAdminMode ? "管理員模式 (點擊鎖定)" : "訪客模式 (點擊解鎖)"}
                            >
                                {isAdminMode ? <Unlock size={16} /> : <Lock size={16} />}
                                {isSidebarOpen && (isAdminMode ? "管理員模式" : "訪客模式")}
                            </button>

                            {isSidebarOpen && (
                                <div className="flex gap-2">
                                    <button onClick={handleExportData} className="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-300 py-1 rounded text-xs flex items-center justify-center gap-1" title="匯出紀錄">
                                        <Download size={12} /> 匯出
                                    </button>
                                    <button onClick={handleImportClick} className="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-300 py-1 rounded text-xs flex items-center justify-center gap-1" title="匯入紀錄">
                                        <Upload size={12} /> 匯入
                                    </button>
                                    <input
                                        type="file"
                                        ref={fileInputRef}
                                        onChange={handleImportFile}
                                        className="hidden"
                                        accept=".json"
                                    />
                                </div>
                            )}
                        </div>

                        <div className="flex-1 overflow-y-auto p-2 space-y-1">
                            {courses.map(course => {
                                const CourseIcon = window.LucideIcons[course.icon] || window.LucideIcons.HelpCircle;
                                return (
                                <div key={course.id} className={`group relative flex items-center w-full rounded-lg transition-colors ${activeCourseId === course.id ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-700'}`}>
                                    <button onClick={() => setActiveCourseId(course.id)} className="flex-1 text-left p-3 flex items-center gap-3 overflow-hidden">
                                        <span className="shrink-0"><CourseIcon size={18} /></span>
                                        {isSidebarOpen && <div className="flex-1 min-w-0"><div className="font-medium truncate">{course.name}</div></div>}
                                    </button>
                                    {isSidebarOpen && isAdminMode && (
                                        <button
                                            onClick={(e) => handleDeleteCourse(course.id, e)}
                                            className="absolute right-2 p-1.5 text-slate-400 hover:text-red-400 hover:bg-slate-900/50 rounded transition-all"
                                            title="刪除副本"
                                        >
                                            <Trash2 size={14} />
                                        </button>
                                    )}
                                </div>
                            )})}
                        </div>
                        {isSidebarOpen && <div className="p-4 border-t border-slate-700 flex gap-2"><input type="text" placeholder="新副本..." className="w-full bg-slate-900 border border-slate-600 rounded px-2 py-1 text-xs" value={newCourseName} onChange={(e) => setNewCourseName(e.target.value)} /><button onClick={handleAddCourse} className="bg-slate-700 hover:bg-slate-600 text-white px-2 rounded"><PlusCircle size={16} /></button></div>}
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col h-full overflow-hidden relative">
                        {activeCourse ? (
                            <>
                                <header className="bg-slate-900 border-b border-slate-800 shadow-xl p-0 relative overflow-hidden shrink-0">
                                    <div className={`absolute inset-0 opacity-20 ${isDefeated ? 'bg-yellow-600' : 'bg-red-900'}`}></div>
                                    <div className="max-w-6xl mx-auto p-4 relative z-10">
                                        <div className="flex flex-col md:flex-row items-center gap-6">
                                            <div className="relative cursor-pointer group shrink-0" onClick={openBossModal}>
                                                <div className={`w-24 h-24 md:w-32 md:h-32 rounded-full border-4 flex items-center justify-center text-6xl shadow-2xl transition-transform transform group-hover:scale-105 ${isDefeated ? 'bg-yellow-900/50 border-yellow-500 grayscale' : 'bg-red-900/50 border-red-500'}`}>{isDefeated ? '💀' : activeBoss.avatar}</div>
                                                {!isDefeated && <div className="absolute -bottom-2 -right-2 bg-red-600 text-white text-xs px-2 py-1 rounded-full font-bold animate-bounce">BOSS</div>}
                                                <div className="absolute top-0 right-0 bg-slate-800 p-1 rounded-full opacity-0 group-hover:opacity-100 transition-opacity border border-slate-600">
                                                    {isAdminMode ? <Edit size={12} className="text-white" /> : <Lock size={12} className="text-slate-400" />}
                                                </div>
                                            </div>
                                            <div className="flex-1 w-full">
                                                <div className="flex justify-between items-end mb-2">
                                                    <div><h2 className="text-2xl font-black text-white flex items-center gap-2 drop-shadow-md">{activeBoss.name} <span className="text-xs px-2 py-0.5 rounded border border-red-500 text-red-500">{activeBoss.difficulty}</span></h2><p className="text-slate-400 text-sm mt-1">{activeBoss.desc}</p></div>
                                                    <div className="text-right"><div className="text-3xl font-mono font-bold text-white tracking-tighter">{totalCP} <span className="text-sm text-slate-500">/ {activeBoss.hp} CP</span></div></div>
                                                </div>
                                                <div className="h-6 bg-slate-800 rounded-full overflow-hidden border border-slate-700 relative shadow-inner">
                                                    <div className={`h-full transition-all duration-1000 ease-out flex items-center justify-end pr-2 ${isDefeated ? 'bg-yellow-500' : 'bg-gradient-to-r from-red-600 to-red-400'}`} style={{ width: `${damagePercent}%` }}></div>
                                                </div>
                                            </div>
                                            <div className="shrink-0 flex flex-col items-center justify-center w-24">
                                                {isDefeated ? <button onClick={handleOpenChest} className="animate-bounce text-5xl">{isChestOpen ? '💰' : '🎁'}</button> : <div className="opacity-30 grayscale flex flex-col items-center"><div className="text-5xl">🔒</div><span className="text-xs text-slate-500">上鎖</span></div>}
                                            </div>
                                        </div>
                                    </div>
                                </header>

                                <div className="flex-1 overflow-y-auto p-4 pb-6 scrollbar-thin scrollbar-thumb-slate-600">
                                    <div className="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
                                        <div className="md:col-span-2 space-y-6">
                                            <button onClick={() => setIsStudentModalOpen(true)} className="w-full bg-indigo-600/20 hover:bg-indigo-600/30 border border-indigo-500/50 text-indigo-300 p-3 rounded-xl flex items-center justify-center gap-2 transition-all hover:scale-[1.01]"><PlusCircle size={20} /> 召喚新英雄</button>

                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                {activeCourse.students.map(student => {
                                                    const job = getJobInfo(student.job);
                                                    const isDead = student.hp <= 0;
                                                    const highestRarity = getHighestRarity(student.inventory);
                                                    const rarityStyle = RARITY_STYLES[highestRarity];
                                                    const AvatarComponent = job.AvatarComponent || WarriorAvatar;

                                                    return (
                                                        <div key={student.id} onClick={() => openInventoryViewer(student)} className={`cursor-pointer bg-slate-800 rounded-xl p-4 border shadow-md transition-all group relative h-full flex flex-col justify-between ${isDead ? 'border-red-500/50 opacity-80' : 'border-slate-700 hover:border-indigo-500 hover:shadow-indigo-500/20'}`}>
                                                            {isDead && (
                                                                <div className="absolute inset-0 z-20 flex items-center justify-center bg-black/80 backdrop-blur-sm rounded-xl flex-col gap-3 p-4 text-center animate-fadeIn">
                                                                    <div className="text-red-500 font-black flex items-center gap-2 text-xl animate-bounce">
                                                                        <Skull size={28} /> 力竭倒地
                                                                    </div>
                                                                    <p className="text-slate-400 text-xs font-medium">
                                                                        請完成指定任務以復活
                                                                    </p>
                                                                    <button
                                                                        onClick={(e) => { e.stopPropagation(); handleRemedy(student.id); }}
                                                                        className="bg-green-600 hover:bg-green-500 text-white px-4 py-1.5 rounded-full text-xs font-bold flex items-center gap-1 shadow-lg shadow-green-900/20 transition-all hover:scale-105 border border-green-400/30"
                                                                    >
                                                                        <Bandage size={14} /> 確認復活
                                                                    </button>
                                                                </div>
                                                            )}

                                                            <div className="flex-1">
                                                                <div className="flex items-start gap-4">
                                                                    <div className={`w-14 h-14 rounded-lg flex items-center justify-center relative shrink-0 border-2 overflow-hidden bg-slate-900 ${rarityStyle.border} ${rarityStyle.shadow} transition-all duration-500`}>
                                                                        <AvatarComponent className="w-full h-full" isAnimated={false} />
                                                                    </div>
                                                                    <div className="flex-1 min-w-0">
                                                                        <div className="flex justify-between items-start">
                                                                            <div>
                                                                                <h3 className="text-base font-bold truncate text-white flex items-center gap-1">{student.name} <Search size={12} className="text-slate-500" /></h3>
                                                                                
                                                                                {/* Job Tooltip Added Here */}
                                                                                <div className="relative group/job w-fit">
                                                                                    <div className="text-xs text-indigo-300 border-b border-dashed border-indigo-500/30 cursor-help">LV.{student.lv} {job.name}</div>
                                                                                    <div className="absolute bottom-full left-0 mb-2 w-48 p-2 bg-slate-900 text-white text-xs rounded border border-indigo-500 shadow-xl opacity-0 group-hover/job:opacity-100 transition-opacity pointer-events-none z-50">
                                                                                        <div className="font-bold text-indigo-400 mb-1 flex items-center gap-1">{job.icon} {job.name}</div>
                                                                                        <div className="mb-2 text-slate-300 leading-tight">{job.desc}</div>
                                                                                        <div className="text-yellow-400 text-[10px] bg-yellow-900/30 p-1 rounded border border-yellow-700/50">✨ {job.bonusText}</div>
                                                                                    </div>
                                                                                </div>

                                                                            </div>
                                                                            <div className="text-right">
                                                                                <div className="text-yellow-400 font-bold text-xs flex items-center justify-end gap-1"><Award size={12} /> {student.cp}</div>
                                                                                <div className="text-green-400 font-bold text-xs flex items-center justify-end gap-1 mt-0.5"><Coins size={12} /> {student.gp}</div>

                                                                                {!isDead && (
                                                                                    <button
                                                                                        onClick={(e) => openShop(student, e)}
                                                                                        className="mt-2 bg-gradient-to-b from-amber-500 to-amber-700 border-b-4 border-amber-900 active:border-b-0 active:translate-y-1 text-white text-[10px] font-bold px-2 py-1 rounded shadow-md hover:scale-110 flex items-center justify-center gap-1 w-full"
                                                                                    >
                                                                                        <ShoppingBag size={10} /> 商店
                                                                                    </button>
                                                                                )}
                                                                            </div>
                                                                        </div>

                                                                        <div className="mt-1 mb-1">
                                                                            <div className="flex justify-between items-center text-[10px] text-slate-400 font-bold px-0.5">
                                                                                <span>EXP</span>
                                                                                <span>{student.xp}/{student.maxXp}</span>
                                                                            </div>
                                                                            <div className="w-full h-1.5 bg-slate-900 rounded-full overflow-hidden border border-slate-700 relative group/xp" title={`經驗值: ${student.xp}/${student.maxXp}`}>
                                                                                <div className="h-full bg-sky-500 rounded-full transition-all duration-500" style={{ width: `${(student.xp / student.maxXp) * 100}%` }} />
                                                                            </div>
                                                                        </div>

                                                                        <div className="flex items-center gap-2">
                                                                            <Heart size={10} className="text-red-400 shrink-0" />
                                                                            <div className="flex-1 h-2 bg-slate-900 rounded-full overflow-hidden border border-slate-700 relative"><div className={`h-full ${student.hp <= 3 ? 'bg-red-600 animate-pulse' : 'bg-red-500'}`} style={{ width: `${(student.hp / student.maxHp) * 100}%` }} /></div>
                                                                            <button onClick={(e) => handleDamage(student.id, e)} disabled={isDead} className="text-slate-500 hover:text-red-400 hover:scale-110 p-1"><Activity size={12} /></button>
                                                                        </div>
                                                                    </div>
                                                                </div>

                                                                <div className="mt-3 h-8 flex gap-1 items-center overflow-x-auto scrollbar-hide">
                                                                    {student.buffs?.length > 0 ? (
                                                                        student.buffs.map((buff, i) => {
                                                                            const d = getBuffInfo(buff.id);
                                                                            return (
                                                                                <div key={`b-${i}`} className="shrink-0 bg-slate-900/80 px-1.5 py-0.5 text-[9px] rounded text-slate-300 flex items-center gap-1 border border-slate-700 shadow-sm relative group/buff cursor-help">
                                                                                    {renderItemIcon(d.iconType, "w-3 h-3 inline mr-1")} {d.name} x{buff.charges}
                                                                                    
                                                                                    {/* Buff Tooltip */}
                                                                                    <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 w-40 p-2 bg-slate-900 text-white text-xs rounded opacity-0 group-hover/buff:opacity-100 pointer-events-none z-50 border border-slate-600 shadow-xl">
                                                                                        <div className={`font-bold mb-1 ${d.color}`}>{d.name}</div>
                                                                                        <div className="text-[10px] text-slate-300 leading-tight">{d.desc}</div>
                                                                                    </div>
                                                                                </div>
                                                                            );
                                                                        })
                                                                    ) : (
                                                                        <span className="text-[9px] text-slate-600 italic px-1">無狀態</span>
                                                                    )}
                                                                </div>

                                                                <div className="mt-2 bg-slate-900/60 p-2 rounded-lg border border-slate-700/50 shadow-inner">
                                                                    <div className="flex items-center justify-between mb-1.5">
                                                                        <div className="flex items-center gap-1 text-[10px] text-slate-400 font-bold uppercase tracking-wider">
                                                                            <Briefcase size={10} /> 背包 (Bag)
                                                                        </div>
                                                                        <span className="text-[9px] text-slate-600">{student.inventory.length}/5</span>
                                                                    </div>

                                        </div>
                                        <div className="mt-6 grid grid-cols-3 gap-3">
                                            <button onClick={() => { setIsInventoryViewerOpen(false); openBuffModal(targetStudent); }} className="bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20 transition-all hover:scale-[1.02] text-xs"><Gift size={16} /> 賜予道具</button>
                                            <button onClick={() => { setIsInventoryViewerOpen(false); setTargetStudent(targetStudent); setNewJobId(targetStudent.job); setIsJobChangeModalOpen(true); }} className="bg-slate-700 hover:bg-slate-600 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-slate-700/20 transition-all hover:scale-[1.02] text-xs"><RefreshCcw size={16} /> 轉職</button>
                                            <button onClick={(e) => openShop(targetStudent, e)} className="bg-gradient-to-b from-amber-500 to-amber-700 border-b-4 border-amber-900 active:border-b-0 active:translate-y-1 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-amber-600/20 transition-all hover:scale-110 text-xs"><ShoppingBag size={16} /> 進入商店</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {isStudentModalOpen && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-800 rounded-2xl w-full max-w-2xl p-6 border border-slate-600">
                                <div className="flex justify-between items-center mb-4"><h2 className="text-xl font-bold text-white">英雄召喚</h2><button onClick={() => setIsStudentModalOpen(false)}><X /></button></div>
                                <input className="w-full bg-slate-900 border border-slate-600 rounded p-3 text-white mb-4 placeholder='姓名'" value={recruitName} onChange={e => setRecruitName(e.target.value)} />
                                <div className="grid grid-cols-2 gap-4 mb-4">{JOB_DEFINITIONS.map(j => <button key={j.id} onClick={() => setRecruitJobId(j.id)} className={`p-4 border rounded ${recruitJobId === j.id ? 'bg-indigo-600/50 border-indigo-500' : 'border-slate-600'}`}><div>{j.icon} {j.name}</div></button>)}</div>
                                <button onClick={submitNewStudent} className="w-full bg-indigo-600 py-2 rounded text-white font-bold">召喚</button>
                            </div>
                        </div>
                    )}

                    {isShopModalOpen && targetStudent && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-fadeIn">
                            <div className="bg-slate-900 rounded-2xl border border-slate-600 w-full max-w-4xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">
                                <div className="p-6 border-b border-slate-700 flex justify-between items-center bg-green-900/20">
                                    <div>
                                        <h2 className="text-2xl font-black text-green-400 flex items-center gap-2"><ShoppingBag /> 哥布林黑市</h2>
                                        <p className="text-sm text-green-300 mt-1">顧客：{targetStudent.name} (持有金幣: {targetStudent.gp} GP)</p>
                                    </div>
                                    <button onClick={() => setIsShopModalOpen(false)} className="text-slate-400 hover:text-white"><X size={24} /></button>
                                </div>
                                <div className="p-6 overflow-y-auto bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')]">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                                        {activeCourse.shopItems.map(item => (
                                            <div key={item.id} className={`relative p-4 rounded-xl border-2 bg-slate-800 flex flex-col gap-3 group transition-all hover:-translate-y-1 hover:shadow-xl ${RARITY_STYLES[item.rarity].border} ${item.ownerId ? 'opacity-50 grayscale cursor-not-allowed' : ''}`}>
                                                <div className="flex justify-between items-start">
                                                    <div className="text-4xl bg-slate-900 w-16 h-16 rounded-lg flex items-center justify-center border border-slate-700">
                                                        {renderItemIcon(item.iconType, "w-8 h-8")}
                                                    </div>
                                                    <div className="text-xs font-bold px-2 py-1 rounded bg-slate-900 border border-slate-600">{item.rarity}</div>
                                                </div>
                                                <div>
                                                    <h3 className="font-bold text-lg text-white">{item.name}</h3>
                                                    <p className="text-xs text-slate-400 mt-1 h-10">{item.desc}</p>
                                                </div>
                                                <div className="mt-auto pt-3 border-t border-slate-700 flex justify-between items-center">
                                                    {item.ownerId ? <span className="text-red-500 font-bold flex items-center gap-1"><Lock size={14} /> 已售出</span> : <div className="text-green-400 font-bold flex items-center gap-1"><Coins size={14} /> {item.cost}</div>}
                                                    {!item.ownerId && <button onClick={() => handleBuyItem(item)} disabled={targetStudent.gp < item.cost} className="px-3 py-1 bg-green-600 hover:bg-green-500 disabled:bg-slate-700 disabled:text-slate-500 text-white text-xs font-bold rounded shadow">購買</button>}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {isBuffModalOpen && targetStudent && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-800 rounded-2xl w-full max-w-lg p-6 border border-slate-600">
                                <div className="flex justify-between items-center mb-4"><h2 className="text-xl font-bold text-white">賜予道具</h2><button onClick={() => setIsBuffModalOpen(false)}><X /></button></div>
                                <div className="space-y-2">{BUFF_DEFINITIONS.map(b => <button key={b.id} onClick={() => setSelectedBuffId(b.id)} className={`w-full p-3 border rounded text-left flex items-center gap-3 ${selectedBuffId === b.id ? 'bg-blue-900/50 border-blue-500' : 'bg-slate-900 border-slate-700'}`}>{renderItemIcon(b.iconType, `w-6 h-6 ${b.color}`)} <div><div className="font-bold text-white">{b.name}</div><div className="text-xs text-slate-400">{b.desc}</div></div></button>)}</div>
                                <button onClick={handleGrantBuff} className="w-full bg-blue-600 py-2 rounded text-white font-bold mt-4">發放</button>
                            </div>
                        </div>
                    )}

                    {isJobChangeModalOpen && targetStudent && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-800 rounded-2xl w-full max-w-lg p-6 border border-slate-600">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-bold text-white">轉職</h2>
                                    <div className="text-sm text-slate-400 bg-slate-900 px-3 py-1 rounded-full border border-slate-700">
                                        剩餘次數: <span className={(targetStudent.jobChangeCount || 0) >= 2 ? "text-red-500" : "text-green-400"}>{2 - (targetStudent.jobChangeCount || 0)}</span>/2
                                    </div>
                                    <button onClick={() => setIsJobChangeModalOpen(false)}><X /></button>
                                </div>
                                <div className="grid grid-cols-2 gap-4">{JOB_DEFINITIONS.map(j => <button key={j.id} onClick={() => setNewJobId(j.id)} className={`p-4 border rounded ${newJobId === j.id ? 'bg-indigo-600/50 border-indigo-500' : 'border-slate-600'}`}><div>{j.icon} {j.name}</div></button>)}</div>
                                <button 
                                    onClick={handleJobChange} 
                                    disabled={(targetStudent.jobChangeCount || 0) >= 2}
                                    className={`w-full py-2 rounded text-white font-bold mt-4 ${
                                        (targetStudent.jobChangeCount || 0) >= 2 
                                        ? "bg-slate-600 cursor-not-allowed text-slate-400" 
                                        : "bg-indigo-600 hover:bg-indigo-500"
                                    }`}
                                >
                                    {(targetStudent.jobChangeCount || 0) >= 2 ? "轉職次數已達上限" : "確認"}
                                </button>
                            </div>
                        </div>
                    )}

                    {isBossModalOpen && (
                        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 w-full max-w-2xl p-6 rounded-2xl border border-slate-600">
                                <h2 className="text-2xl font-bold text-red-500 mb-4">魔王設定</h2>
                                <div className="grid grid-cols-2 gap-4 mb-4">{BOSS_DEFINITIONS.map(b => <button key={b.id} onClick={() => setSelectedBossId(b.id)} className={`p-4 border rounded flex items-center gap-2 ${selectedBossId === b.id ? 'border-red-500 bg-red-900/20' : 'border-slate-700'}`}><span className="text-2xl">{b.avatar}</span><div><div className="font-bold text-white">{b.name}</div><div className="text-xs text-slate-400">HP: {b.hp}</div></div></button>)}</div>
                                <input className="w-full bg-slate-800 border border-slate-600 rounded p-3 text-white mb-4 placeholder='寶箱獎勵內容...'" value={customReward} onChange={e => setCustomReward(e.target.value)} />
                                <div className="flex justify-end gap-2"><button onClick={() => setIsBossModalOpen(false)} className="text-slate-400 px-4">取消</button><button onClick={handleSaveBoss} className="bg-red-600 text-white px-6 py-2 rounded font-bold">召喚</button></div>
                            </div>
                        </div>
                    )}

                    {isEditStudentModalOpen && editingStudent && (
                        <div className="fixed inset-0 bg-black/80 z-[150] flex items-center justify-center p-4 animate-fadeIn">
                            <div className="bg-slate-900 p-6 rounded-2xl border border-slate-600 w-full max-w-md shadow-2xl">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-xl font-bold text-white flex items-center gap-2"><Edit size={20} /> 編輯英雄資料</h3>
                                    <button onClick={() => setIsEditStudentModalOpen(false)}><X className="text-slate-400 hover:text-white" /></button>
                                </div>
                                
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">英雄姓名</label>
                                        <input 
                                            type="text" 
                                            value={editingStudent.name} 
                                            onChange={(e) => setEditingStudent({...editingStudent, name: e.target.value})}
                                            className="w-full bg-slate-800 border border-slate-600 rounded p-2 text-white text-sm"
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs text-yellow-400 mb-1 font-bold">CP (勇氣值)</label>
                                            <input 
                                                type="number" 
                                                value={editingStudent.cp} 
                                                onChange={(e) => setEditingStudent({...editingStudent, cp: parseInt(e.target.value) || 0})}
                                                className="w-full bg-slate-800 border border-slate-600 rounded p-2 text-white text-sm"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-green-400 mb-1 font-bold">GP (金幣)</label>
                                            <input 
                                                type="number" 
                                                value={editingStudent.gp} 
                                                onChange={(e) => setEditingStudent({...editingStudent, gp: parseInt(e.target.value) || 0})}
                                                className="w-full bg-slate-800 border border-slate-600 rounded p-2 text-white text-sm"
                                            />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs text-red-400 mb-1 font-bold">HP (當前血量)</label>
                                            <input 
                                                type="number" 
                                                value={editingStudent.hp} 
                                                max={editingStudent.maxHp}
                                                onChange={(e) => setEditingStudent({...editingStudent, hp: Math.min(parseInt(e.target.value) || 0, editingStudent.maxHp)})}
                                                className="w-full bg-slate-800 border border-slate-600 rounded p-2 text-white text-sm"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-blue-400 mb-1 font-bold">XP (經驗值)</label>
                                            <input 
                                                type="number" 
                                                value={editingStudent.xp} 
                                                onChange={(e) => setEditingStudent({...editingStudent, xp: parseInt(e.target.value) || 0})}
                                                className="w-full bg-slate-800 border border-slate-600 rounded p-2 text-white text-sm"
                                            />
                                        </div>
                                    </div>
                                </div>

                                <div className="flex gap-3 mt-8">
                                    <button onClick={() => setIsEditStudentModalOpen(false)} className="flex-1 py-2 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold">取消</button>
                                    <button onClick={handleSaveStudentEdit} className="flex-1 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-500 font-bold">儲存修改</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* NEW: Random Challenge Modal */}
                    {isChallengeModalOpen && activeChallenge && (
                        <div className="fixed inset-0 bg-black/90 z-[200] flex items-center justify-center p-4 animate-fadeIn">
                            <div className="bg-slate-900 border-2 border-red-500 rounded-2xl w-full max-w-lg p-8 shadow-[0_0_50px_rgba(220,38,38,0.5)] relative overflow-hidden text-center">
                                <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/diagmonds-light.png')] opacity-10 pointer-events-none"></div>
                                
                                <div className="text-6xl mb-4 animate-bounce-slow">{activeChallenge.monster.icon}</div>
                                <h2 className="text-3xl font-black text-red-500 mb-2 animate-pulse">野生的小怪跳出來了！</h2>
                                <p className="text-xl text-white font-bold mb-4">{activeChallenge.monster.name}</p>
                                <div className="bg-slate-800/80 p-4 rounded-lg border border-slate-600 mb-6">
                                    <p className="text-slate-300 mb-2 text-sm">{activeChallenge.monster.desc}</p>
                                    <p className="text-lg text-yellow-400 font-bold">
                                        請 <span className="text-white text-xl border-b-2 border-yellow-500">{activeChallenge.studentName}</span> 回答老師的問題！
                                    </p>
                                </div>

                                <div className="grid grid-cols-2 gap-4">
                                    <button 
                                        onClick={() => handleChallengeResolve(true)}
                                        className="py-4 bg-green-600 hover:bg-green-500 text-white rounded-xl font-bold text-lg shadow-lg border-b-4 border-green-800 active:border-b-0 active:translate-y-1 transition-all"
                                    >
                                        ✅ 回答正確 (Critical Hit!)
                                    </button>
                                    <button 
                                        onClick={() => handleChallengeResolve(false)}
                                        className="py-4 bg-red-600 hover:bg-red-500 text-white rounded-xl font-bold text-lg shadow-lg border-b-4 border-red-800 active:border-b-0 active:translate-y-1 transition-all"
                                    >
                                        ❌ 回答錯誤 (Miss...)
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showRewardModal && (
                        <div className="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4 animate-fadeIn">
                            <div className="text-center">
                                <Trophy size={80} className="mx-auto text-yellow-400 mb-4 animate-bounce" />
                                <h2 className="text-4xl font-bold text-white mb-4">魔王擊敗！</h2>
                                <div className="bg-slate-800 p-8 rounded-xl border-2 border-yellow-500 mb-8"><p className="text-slate-400 text-sm mb-2">寶箱獎勵</p><p className="text-2xl text-white font-bold">{activeCourse.bossReward}</p></div>
                                <button onClick={() => setShowRewardModal(false)} className="bg-white text-black px-8 py-3 rounded-full font-bold">領取</button>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppContainer />);
    </script>
</body>
</html>
